# 21 维风格 rubric —— 大模型裁判的判据（FIX-322 建，FIX-323 扩维，FIX-327 去重）
#
# 由 style-card.md 派生：卡给人写稿用，这里给裁判打分用。
# band 0–4：4 = 与作者一致，2 = 有偏差但不假，0 = 另一个人的声音。
# 1 / 3 分别是相邻两档之间的过渡，不写锚点。
# 每条 anchors 里的数字是 2026-11-04 旧语料的作者统计（54 篇 / 138,449 汉字），
# 保留作历史锚点；2026-11-05 FIX-350 起语料为三审书稿 61 篇（profile.json 为准），
# rubric 只作诊断、不参与放行。
# 复算：python scripts/voice/corpus_probe.py
version: "1.4.2"
prompt_version: 6
author_slug: panchen
author: 潘辰（《孤岛成林》语料作者）

#: 关键维：任一条低于基线一档，整体判定就不能靠其它维凑分。
key_dims: ["1", "2", "6", "7"]

#: 证据校验：每个维度的 quote 必须能在正文里逐字找到（空白归一化后）。
evidence_required: true

#: 同一特征只许一个维判，否则同一处文字被算两次分（FIX-327 去重）。
#: `validate_rubrics` 验：关键词只出现在这个维的锚点里；出现在两个维就报错。
#: 确定性层已经判的（感叹号、emoji、问句占比）裁判层不重复判。
ownership:
  "感叹号": "8"
  "分点": "8"
  "排比": "8"
  "骈偶": "8"
  "笔者": "19"
  "本文": "19"
  "省略号": "2"
  "被字句": "11"
  "通感": "5"
  "类比": "5"
  "评论": "14"
  "让步": "17"
  "概念": "12"
  "辞格": "5"

dims:
  - id: "1"
    name: 视角与人称
    attrs: [L5-01]
    anchors:
      "4": 「我」讲自己的事，句子里是「我」不是「我们」；不用「我们每个人」「作为一名……的人」这种集体经验，也不靠「让我们」把读者拉进来。
      "2": 以「我」为主，但常滑向「我们」「大家」的集体经验。
      "0": 第三人称转述、无人称、集体说教。
    evidence_hint: 抄一句能证明人称的原文。

  - id: "2"
    name: 句法
    attrs: [L2-07, L2-09, L1-04]
    anchors:
      "4": 句子平均 30–35 字；长句靠逗号串 3–4 个小句往前推（逗号与句号约 2.7:1）；几乎不用顿号、分号、破折号、括号补注；省略号只用六点「……」，不拿它断句。
      "2": 句长偏短（约 15–20 字）或偏长，但仍以逗号推进；偶有顿号、破折号、括号补注。
      "0": 短句为主、每个小句一个句号；或欧化长句堆定语从句；或同一句式连排 4 句以上。
    evidence_hint: 抄一句最能代表句法节奏的原文。

  - id: "3"
    name: 段落与节奏
    attrs: [L4-03, L5-03]
    anchors:
      "4": 主段 150–300 字，把一件事铺开；段与段之间长短交替；判断句、情绪句常单独成段，有一处一句话成段就算。
      "2": 段落偏均匀（每段三五行），但仍有一两处短段。
      "0": 每段等长如排版；或全篇不分段；或每句一段。
    evidence_hint: 抄一句单独成段的短句，或说明段落长度偏均匀。

  - id: "4"
    name: 用词
    attrs: [L5-10, L1-18]
    anchors:
      "4": 用口语常用词（觉得、之后、知道、时候）；同一个高频词在一篇里重复出现；不堆成语（中位 0 个/千字）；文言标记约 1 个/千字。
      "2": 大体口语，但偶有书面替换（认为、此外、因此、综上所述）或一两处成语。
      "0": 公文腔、书面同义词替换、堆四字词、文言堆砌。
    evidence_hint: 抄一句口语词用得最明显的原文。

  - id: "5"
    name: 修辞与比喻
    attrs: [L6-01, L6-02, L6-03, L6-05, L6-06, L6-09]
    anchors:
      "4": 比喻少而具体，喻体是眼前生活物（孩子、电流、手机、天气、枣子、木百叶窗）；通篇不用比喻也算 4；辞格总量低，多数段落一处都没有；不写通感（「声音是甜的」）；类比（「好比」「等于」）只用来把一件眼前的事说清，不用来讲道理；引用只引一件具体作品或一句话，然后回到自己的经历。
      "2": 有比喻但偏抽象或套语（「像一把刀」）；或辞格偏多（一段一处以上）；或偶有一处用典；或拿类比当论证。
      "0": 用修辞撑场面：句句比喻、通篇借代夸张；引经据典堆典故；宏大比喻堆叠（「时代的洪流」）；每段都用类比讲道理。
    evidence_hint: 抄一个比喻、一处引用或一句类比的原文。

  - id: "6"
    name: 语气与立场
    attrs: [L7-01, L7-03, L7-04, L7-06, L7-07, L7-11]
    anchors:
      "4": 以陈述句为主，判断不硬；不用增强词（必须、一定、毫无疑问），不喊口号，容许自嘲。
      "2": 有缓和也有少量强断言；偶有煽情或喊话。
      "0": 断言腔或口号腔（必须、一定、毫无疑问、让我们）；煽情、喊话。
    evidence_hint: 抄一句最能代表判断语气的原文。

  - id: "7"
    name: 结构套路
    attrs: [L4-01, L4-02, L4-04, L4-06, L4-07, L4-08]
    anchors:
      "4": 开头第一段第一句是具体的时间、地点或动作；中段引一件作品或一段回想；结尾落回自己，常带自嘲或一句玩笑；可带 PS 段（语料 39/54 篇有 PS）。
      "2": 开头偏概括（观点或背景）但很快进入具体；结尾有收束，但无自嘲、无 PS。
      "0": 开头从大道理或定义开始；结尾喊口号或总结陈词；全篇无个人落点。
    evidence_hint: 抄正文第一段第一句（跳过标题行）或结尾最后一句的原文。

  - id: "8"
    name: 雷区与负空间
    attrs: [L2-06, L3-03, L6-11, L10-01]
    anchors:
      "4": 不排比、不写骈偶与对偶、不堆四字词、不写欧化句（「一个……的存在」「被……所」「进行+抽象名词」）；不用分点列表或小标题；emoji、感叹号由确定性脚本另判，这里不重复扣分。
      "2": 偶有一处排比、对偶或欧化句，整体不靠它们撑场面；或有一处小标题。
      "0": 靠排比/骈偶撑场面（成段同构句）；或通篇分点列表、小标题；或欧化句连篇。
    evidence_hint: 若触碰雷区，抄那一句；若没触碰，抄一句能证明没有这些毛病的原文。

  # ---- v1.1.0 追加 5 维：卡内未覆盖的 5 条属性（FIX-323 第 1 批）----

  - id: "9"
    name: 引号与书名号
    attrs: [L1-03]
    anchors:
      "4": 引用别人的话用弯引号「“”」，全篇不出现「」；提到作品用《》（一半篇目至少一处）；引号只套一层，不把课程、奖项、机构名一起套进去。
      "2": 弯引号为主，偶有一处直引号或「」；书名偶尔裸写不带书名号。
      "0": 以「」或英文直引号为主；或引号套引号、书名号套书名号；或把整串身份头衔套进引号。
    evidence_hint: 抄一句带引号或书名号的原文。

  - id: "10"
    name: 时序
    attrs: [L5-02]
    anchors:
      "4": 顺叙为主，时间标记（后来、那时候、之前、之后、那年）约 4 个/千字（语料中位 3.9，多数 3–6）；回忆插进来时写明怎么回到现在，读者能排出先后。
      "2": 时间标记偏少（约 1–2 个/千字），或有一段插叙但没回到主线。
      "0": 通篇没有时间线；或倒叙叠倒叙；或前后跳跃，读者排不出先后。
    evidence_hint: 抄一句带时间标记的原文。

  - id: "11"
    name: 能动与关系
    attrs: [L8-09, L2-10]
    anchors:
      "4": 写自己做过的事用行动词（决定、选择、坚持、做到）约 1.4 个/千字，写关系用「一起、陪、在乎、朋友」约 4 个/千字，关系词约为行动词的三倍（语料 1.40 对 3.98）；事情是自己做的，被字句极少，不写成被时代、被别人推着。
      "2": 行动词与关系词差不多，或只写关系不写自己做了什么；偶有一两处被字句。
      "0": 通篇被动（被安排、被推着、身不由己）；或堆成功学行动词（搞定、逆袭、拿到结果），把关系写成工具。
    evidence_hint: 抄一句写自己做决定、或一句写关系的原文。

  - id: "12"
    name: 抽象层级
    attrs: [L9-01, L9-02]
    anchors:
      "4": 抽象词（意义、价值、本质、状态、认知）约 0.6 个/千字，很少超过 1.5，同一个概念词不反复出现；道理从一件具体事里长出来，判断落在人、事、物上。
      "2": 抽象词 1.5–3 个/千字，出现「意义」「价值」类总结句、概念词反复出现，但仍有具体事撑着。
      "0": 抽象词超过 3 个/千字，通篇概念、层面、维度；举不出具体的人或事。
    evidence_hint: 抄一句抽象判断，或一句具体到人/物/动作的原文。

  - id: "13"
    name: 推理路径
    attrs: [L9-04]
    anchors:
      "4": 归纳：先讲一件具体事，用「所以」「于是」「才明白」往上收，结论走一两步就停；几乎不用「因此」「由此」「这说明」（语料中位 0 个/千字）。
      "2": 有一两处「因此」「这说明」，或从一件小事直接跳到大结论。
      "0": 通篇演绎（先给结论再举例）；或「因为…所以…因此」链式推理。
    evidence_hint: 抄一句把事引出结论的原文。

  # ---- v1.2.0 追加 5 维：判档里未覆盖的叙述面（FIX-323 第 2 批）----

  - id: "14"
    name: 叙述距离
    attrs: [L5-05]
    anchors:
      "4": 讲述为主但有介入：用「我觉得」「其实」「可能」评论约 3 个/千字（语料中位 3.0，多数 1.7–4.0）；评论是自己想到的，不是替读者下结论；不中途跳出来解释背景。
      "2": 评论偏少（低于 1.5）像流水账；或评论过多，每段都补一句道理。
      "0": 通篇说教式评论；或零介入的纯客观转述。
    evidence_hint: 抄一句作者自己插进来的评论。

  - id: "15"
    name: 自省深度
    attrs: [L9-06]
    anchors:
      "4": 有反身句（我发现、我才、回头看、其实我），约 0.5 个/千字（中位 0.48；38/54 篇至少一处）；自省是回头看自己当时的反应，不是给自己打气。
      "2": 有一处自省，但停在自己不该这样，没有往下看。
      "0": 通篇没有反身句；或自省写成自我表扬、心灵鸡汤。
    evidence_hint: 抄一句回头看自己的原文。

  - id: "16"
    name: 视角转换
    attrs: [L9-07]
    anchors:
      "4": 「我」为主，同一段里混用「他/她」讲别人（52/54 篇如此），第三人称约 6 个/千字；需要时直接对「你」说（中位 2 个/千字，44/54 篇有）；指代清楚。
      "2": 几乎只写「我」，别人只作背景；或第三人称一整段跑题。
      "0": 视角乱跳、指代不清；或通篇第三人称。
    evidence_hint: 抄一句把「我」和「他」放在同一段的原文。

  - id: "17"
    name: 反方意识
    attrs: [L9-09, L7-08]
    anchors:
      "4": 主动提反例或让步（但也有、不过、反过来、有人说），约 1.2 个/千字（中位 1.16；49/54 篇有）；提完不硬驳，常以「或许」收。
      "2": 只有一处让步，或让完立刻把对方驳倒。
      "0": 通篇单向断言，无反例、无让步。
    evidence_hint: 抄一句让步或提反例的原文。

  - id: "18"
    name: 轶事与自传性
    attrs: [L5-08]
    anchors:
      "4": 讲自己的经历：具体时间、地点或动作，事情能指到具体那一天；细节是生活里的小事。
      "2": 夹叙夹议，例子多是别人的或听来的。
      "0": 通篇议论、没有自己的经历；或用「我」讲虚构的宏大故事。
    evidence_hint: 抄一句带具体时间或场景、并且是自己的经历的原文。

  # ---- v1.3.0 追加 3 维：去重后仍能单篇判的 3 条（FIX-323 第 3 批）----

  - id: "19"
    name: 读者设定
    attrs: [L0-03, L4-13]
    anchors:
      "4": 把读者当同代人：不用「您」「诸位」「读者朋友」，也不用「本文」「笔者」自称（语料 0 个/千字，仅 2 篇偶现，最高 0.42）；不解释大家都懂的背景，不插「如上所述」这类导读。
      "2": 偶有一处「笔者」「本文」，或一处给读者补常识。
      "0": 通篇喊「读者朋友」「您」，教程式解释，或通篇书面自称。
    evidence_hint: 抄一句能看出对谁说、以及有没有解释背景的原文。

  - id: "20"
    name: 描写配比
    attrs: [L5-07]
    anchors:
      "4": 场景靠感官细节撑：看见、听到、闻到、摸、味道、光线约 1.7 个/千字（语料中位 1.68，多数 0.8–2.3）；有身体动作和所处环境，不只停在概括叙述。
      "2": 有场景但多为概括（「那天很开心」），感官细节低于 0.8。
      "0": 通篇抽象叙述，没有具体场景与身体感受；或大段堆感官词（超过 3.5）像景物描写作业。
    evidence_hint: 抄一句带感官细节的场景原文。

  - id: "21"
    name: 联想跨度
    attrs: [L9-03]
    anchors:
      "4": 段落之间靠一件小事或一个念头接过去，相邻两段的用字重合低（语料中位 0.20）；跳出去以后会拉回来，读者跟得上。
      "2": 段落之间靠「另外」「再说」硬接，或跳出去回不来。
      "0": 每段自成一题，读完不知道在讲什么；或全篇只围绕一件事反复说。
    evidence_hint: 抄一句把上一段接过来、或明显跳开的原文。
