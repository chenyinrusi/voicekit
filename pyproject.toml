[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writer-voice"
version = "0.1.10"
description = "提炼一个作者的文风，体检一篇稿子，按他的腔起稿（命令名 voicekit）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "voicekit contributors" }]
keywords = ["writing", "style", "chinese", "prose", "lint", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/chenyinrusi/voicekit"
Issues = "https://github.com/chenyinrusi/voicekit/issues"

[project.scripts]
voicekit = "voicekit.cli:main"

[tool.setuptools.packages.find]
include = ["voicekit*"]

[tool.setuptools.package-data]
"voicekit.core" = ["rubrics.yaml"]
